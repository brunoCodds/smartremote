# v0.8 - item 6 da auditoria: CI simples de verdade, ainda ausente até
# aqui. De propósito, sem nada mais sofisticado (lint, cobertura,
# publicação de artefato etc) por enquanto - só o suficiente para pegar
# regressão de compilação e dos testes unitários novos (ver item 5) em
# todo push/PR.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # JDK 21 - mesma versão do toolchain configurado no projeto
      # (ver gradle/gradle-daemon-jvm.properties: toolchainVersion=21),
      # exigida pela AGP 9.2.1 usada aqui (ver gradle/libs.versions.toml).
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes unitários
        run: ./gradlew test --stacktrace

      - name: Buildar APK de debug
        run: ./gradlew assembleDebug --stacktrace
